name: Keepalive

on:
  schedule:
    # Monthly activity keeps public scheduled workflows enabled.
    - cron: '23 3 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    name: Record monthly activity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Commit keepalive timestamp
        shell: bash
        run: |
          set -euo pipefail

          date -u +'%Y-%m-%dT%H:%M:%SZ' > keepalive.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add keepalive.txt
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: keepalive $(date -u +%Y-%m)"
          git push
